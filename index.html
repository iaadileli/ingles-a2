<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4ece0">
<title>Inglés A2 · Ejercicios</title>
<style>
  :root{
    --crema:#f6efe3;
    --crema2:#efe5d4;
    --tinta:#2c2a26;
    --tinta-suave:#6b655b;
    --acento:#c25b3a;
    --acento-soft:#e7d9c6;
    --borde:#ddd0bc;
    --sombra:0 10px 30px rgba(70,55,35,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    background:linear-gradient(160deg,var(--crema),var(--crema2));
    color:var(--tinta);
    display:flex;flex-direction:column;align-items:center;
    padding:max(24px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  header{width:100%;max-width:560px;text-align:center;margin:8px 0 22px}
  h1{font-size:1.9rem;margin:0;letter-spacing:.3px}
  .sub{color:var(--tinta-suave);font-size:.95rem;margin-top:6px}

  .lista{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
  .item{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;
    background:#fffdf8;border:1px solid var(--borde);border-radius:18px;
    box-shadow:var(--sombra);padding:18px 20px;transition:transform .12s
  }
  .item:active{transform:scale(.985)}
  .item .num{
    flex:0 0 auto;width:42px;height:42px;border-radius:50%;
    background:var(--acento-soft);color:var(--acento);
    display:flex;align-items:center;justify-content:center;
    font-family:system-ui,sans-serif;font-weight:700;font-size:1.05rem
  }
  .item .txt{flex:1;min-width:0}
  .item h2{font-size:1.2rem;margin:0 0 3px}
  .item p{margin:0;color:var(--tinta-suave);font-size:.9rem;font-family:system-ui,sans-serif}
  .item .go{color:var(--acento);font-size:1.3rem;flex:0 0 auto}
  .tema{display:inline-block;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;
        color:var(--acento);font-family:system-ui,sans-serif;font-weight:600;margin-bottom:2px}

  footer{margin-top:auto;padding-top:28px;font-family:system-ui,sans-serif;
         font-size:.8rem;color:var(--tinta-suave);text-align:center}
</style>
</head>
<body>
<header>
  <h1>Inglés A2</h1>
  <div class="sub">Ejercicios de clase · uno por tema, para practicar en el móvil</div>
</header>

<nav class="lista" id="lista">
  <a class="item" href="verbos/">
    <div class="num">1</div>
    <div class="txt">
      <span class="tema">Verbos</span>
      <h2>Verbos irregulares y regulares</h2>
      <p>150 verbos · escribir o pinchar opciones · pronunciación</p>
    </div>
    <div class="go">→</div>
  </a>
</nav>

<footer>Cada ejercicio nuevo se añade aquí arriba.</footer>
</body>
</html>
